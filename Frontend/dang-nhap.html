<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Neptruyen</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/library.css">
</head>

<body class="library-site account-page">

    <div class="login-container">

        <div class="login-box">

            <a class="site-brand account-brand" href="trang-chu.html"><span class="brand-symbol">N</span><span>Neptruyen<span class="brand-period">.</span></span></a>
            <h1>Chào mừng trở lại</h1>
            <p class="subtitle">Đăng nhập vào tài khoản của bạn</p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Nhập email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Nhập mật khẩu"
                        required
                    >
                </div>

                <button type="submit" class="btn-login">
                    Đăng nhập
                </button>

            </form>

            <p id="loginMessage"></p>

            <p style="margin-top: 20px; text-align: center; font-size: 14px;">
                Chưa có tài khoản? <a href="dang-ky.html" style="color: #007bff; text-decoration: none; font-weight: bold;">Đăng ký ngay</a>
            </p>
        </div>

    </div>

    <script src="js/api.config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js?v=2"></script>

</body>
</html>

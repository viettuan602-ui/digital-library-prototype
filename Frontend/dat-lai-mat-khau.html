<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Đặt mật khẩu mới | Neptruyen</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/library.css">
</head>
<body class="library-site account-page">
    <main class="login-container">
        <section class="login-box">
            <a class="site-brand account-brand" href="trang-chu.html"><span class="brand-symbol">N</span><span>Neptruyen<span class="brand-period">.</span></span></a>
            <h1>Đặt mật khẩu mới</h1>
            <p class="subtitle">Liên kết chỉ dùng được một lần và hết hạn sau 30 phút.</p>
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">Mật khẩu mới</label>
                    <input type="password" id="newPassword" autocomplete="new-password" minlength="8" maxlength="256" placeholder="Ít nhất 8 ký tự" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Nhập lại mật khẩu mới</label>
                    <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" maxlength="256" placeholder="Nhập lại mật khẩu" required>
                </div>
                <button type="submit" class="btn-login" id="resetPasswordButton">Cập nhật mật khẩu</button>
            </form>
            <p id="resetPasswordMessage" role="status" aria-live="polite"></p>
            <p style="margin: 14px 0 0; font-size: 13px;"><a href="dang-nhap.html">Quay lại đăng nhập</a></p>
        </section>
    </main>
    <script src="js/api.config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>

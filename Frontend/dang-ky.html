<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản | Neptruyen</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/library.css">
</head>
<body class="library-site account-page">
    <div class="login-container">
        <div class="login-box">
            <a class="site-brand account-brand" href="trang-chu.html"><span class="brand-symbol">N</span><span>Neptruyen<span class="brand-period">.</span></span></a>
            <h1>Tạo tài khoản</h1>
            <p class="subtitle">Tạo tài khoản độc giả Neptruyen</p>

            <form id="registerform">
                <div class="form-group">
                    <label for="regEmail">Email *</label>
                    <input 
                        type="email"
                        id="regEmail"
                        placeholder="Nhập email của bạn"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="regPassword">Mật Khẩu *</label>
                    <input
                        type="Password"
                        id="regPassword"
                        placeholder="Nhập mật khẩu"
                        required

                    >
                </div>

                <div class="form-group">
                    <label for="regConfirmPassword">Xác nhận mật khẩu *</label>
                    <input
                        type="password"
                        id="regConfirmPassword"
                        placeholder="Nhập lại mật khẩu"
                        required
                    >
                </div>

                <button type="submit" class="btn-login" id="btnRegister">
                    Đăng ký
                </button>
            </form>

            <p id="registerMessage" style="margin-top: 15px; font-weight: bold;"></p>

            <p style="margin-top: 20px; text-align: center; font-size: 14px;">
                Đã có tài khoản? <a href="dang-nhap.html" style="color: #007bff; text-decoration: none; font-weight: bold;">Đăng nhập ngay</a>
            </p>
        </div>
    </div>

    <script src="./js/api.config.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/register.js?v=3"></script>
</body>
</html>

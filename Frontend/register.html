<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital-Library - Đăng ký tài khoản</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>
                DIgital Library
            </h1>
            <p class="subtitle">Đăng ký tài khoản độc giả</p>

            <form id="registerform">
                <div class="form-group">
                    <label for="regEmail">Email *</label>
                    <input 
                        type="email"
                        id="regEmail"
                        placeholder="Nhập email của bạn"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="regPassword">Mật Khẩu *</label>
                    <input
                        type="Password"
                        id="regPassword"
                        placeholder="Nhập mật khẩu"
                        required

                    >
                </div>

                <div class="form-group">
                    <label for="regConfirmPassword">Xác nhận mật khẩu *</label>
                    <input
                        type="password"
                        id="regConfirmPassword"
                        placeholder="Nhập lại mật khẩu"
                        required
                    >
                </div>

                <button type="submit" class="btn-login" id="btnRegister">
                    Đăng ký
                </button>
            </form>

            <p id="registerMessage" style="margin-top: 15px; font-weight: bold;"></p>

            <p style="margin-top: 20px; text-align: center; font-size: 14px;">
                đã có tài khoản? <a href="login.html" style="color: #007bff; text-decoration: none; font-weight: bold;">Đăng nhập ngay</a>
            </p>
        </div>
    </div>

    <script src="./js/api.config.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/register.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f4ee">
    <title>Đang đọc | Neptruyen</title>
    <link rel="stylesheet" href="css/read.css">
</head>
<body data-theme="paper">
    <header class="reader-topbar">
        <a class="reader-brand" href="kham-pha-truyen.html" aria-label="Về thư viện Neptruyen">
            <span class="brand-mark">N</span><span>Neptruyen<span class="brand-period">.</span></span>
        </a>
        <a id="detailsLink" class="back-to-book" href="kham-pha-truyen.html">← <span>Chi tiết truyện</span></a>
        <div class="reader-actions" aria-label="Tùy chỉnh giao diện đọc">
            <div class="font-controls" aria-label="Cỡ chữ">
                <button id="fontDown" type="button" aria-label="Giảm cỡ chữ">A−</button>
                <button id="fontUp" type="button" aria-label="Tăng cỡ chữ">A+</button>
            </div>
            <button id="themeButton" class="theme-button" type="button" aria-label="Đổi nền đọc">☾ <span>Tối</span></button>
        </div>
    </header>

    <div class="reading-progress" aria-hidden="true"><span id="progressBar"></span></div>

    <main class="reader-shell">
        <nav class="reader-breadcrumb" aria-label="Đường dẫn">
            <a href="kham-pha-truyen.html">Thư viện</a><span>/</span><a id="backToDetails" href="kham-pha-truyen.html">Truyện</a><span>/</span><span>Đọc</span>
        </nav>

        <header class="chapter-header">
            <p class="reader-eyebrow">KHÔNG GIAN ĐỌC NEPTRUYEN</p>
            <h1 id="bookTitle">Đang tải truyện…</h1>
            <p id="bookMeta" class="book-meta"></p>
            <div class="chapter-divider"><span>✦</span></div>
            <h2 id="readerHeading">Toàn văn</h2>
        </header>

        <section id="readerStatus" class="reader-status" role="status" aria-live="polite">
            <span class="loading-mark" aria-hidden="true"></span>
            <p>Đang chuẩn bị nội dung đọc…</p>
        </section>
        <section id="readerError" class="reader-error" role="alert" hidden>
            <span class="error-mark" aria-hidden="true">!</span>
            <h2>Chưa thể mở nội dung</h2>
            <p id="errorText"></p>
            <a id="errorLoginLink" href="dang-nhap.html" hidden>Đăng nhập để đọc truyện này</a>
            <button id="retryButton" class="retry-button" type="button">Thử lại</button>
        </section>
        <article id="chapterContent" class="reading-content" aria-label="Nội dung truyện" hidden></article>

        <footer id="readerEnd" class="reader-end" hidden>
            <span>✦</span>
            <p id="readerProgressText">Sẵn sàng tải nội dung truyện.</p>
            <button id="loadMoreButton" class="load-more-button" type="button">Tải 30 trang tiếp theo</button>
            <a id="endDetailsLink" href="kham-pha-truyen.html">Quay lại trang truyện</a>
        </footer>
    </main>

    <script src="js/api.config.js"></script>
    <script src="js/api.js"></script>
    <script type="module" src="js/read.js?v=5"></script>
</body>
</html>

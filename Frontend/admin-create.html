<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo sách mới - Digital Library</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-container admin-container">
        <header class="page-header">
            <div>
                <a class="admin-back-link" href="admin.html">← Menu quản trị</a>
                <h1>Tạo sách mới</h1>
                <p id="adminUserInfo">Đang tải thông tin tài khoản...</p>
            </div>
            <button class="admin-button admin-button-secondary" id="logoutBtn" type="button">Đăng xuất</button>
        </header>

        <main class="admin-narrow">
            <section class="admin-panel">
                <p class="admin-eyebrow">BƯỚC 1 · THÔNG TIN SÁCH</p>
                <h2>Thêm sách vào thư viện</h2>
                <p class="admin-help">Sau khi tạo thành công, ID sẽ được lưu ở đây và chuyển tiếp sang màn upload.</p>

                <form id="createBookForm" class="admin-form">
                    <div class="admin-field">
                        <label for="bookTitle">Tiêu đề sách <span>*</span></label>
                        <input type="text" id="bookTitle" required maxlength="300" autocomplete="off">
                    </div>
                    <div class="admin-field">
                        <label for="bookAuthor">Tác giả <span>*</span></label>
                        <input type="text" id="bookAuthor" required maxlength="200" autocomplete="off">
                    </div>
                    <div class="admin-field">
                        <label for="bookCategory">Thể loại <span>*</span></label>
                        <input type="text" id="bookCategory" required maxlength="100" placeholder="Ví dụ: Văn học, Công nghệ thông tin">
                    </div>
                    <div class="admin-field">
                        <label for="bookAccessLevel">Mức độ truy cập</label>
                        <select id="bookAccessLevel">
                            <option value="PUBLIC">PUBLIC · Ai cũng đọc được</option>
                            <option value="MEMBER">MEMBER · Cần tài khoản Reader</option>
                        </select>
                    </div>
                    <button class="admin-button admin-button-primary admin-submit" type="submit" id="btnCreateBook">Tạo sách</button>
                </form>
                <p class="admin-message" id="createBookMessage" role="status" aria-live="polite"></p>
            </section>

            <section class="admin-result-card" id="createdBookResult" hidden aria-live="polite">
                <div class="admin-result-icon" aria-hidden="true">✓</div>
                <div class="admin-result-content">
                    <p class="admin-eyebrow">TẠO SÁCH THÀNH CÔNG</p>
                    <h2 id="createdBookTitle">Sách đã được thêm</h2>
                    <label for="createdBookId">ID sách</label>
                    <div class="admin-id-row">
                        <input id="createdBookId" type="text" readonly>
                        <button class="admin-button admin-button-secondary" id="copyBookIdBtn" type="button">Sao chép</button>
                    </div>
                    <a class="admin-button admin-button-primary" id="continueToUpload" href="admin-publish.html">Tiếp tục: Upload PDF và xuất bản <span aria-hidden="true">→</span></a>
                </div>
            </section>
        </main>
    </div>
    <script src="js/api.config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Quên mật khẩu | Neptruyen</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/library.css">
</head>
<body class="library-site account-page">
    <main class="login-container">
        <section class="login-box">
            <a class="site-brand account-brand" href="trang-chu.html"><span class="brand-symbol">N</span><span>Neptruyen<span class="brand-period">.</span></span></a>
            <h1>Khôi phục mật khẩu</h1>
            <p class="subtitle">Nhập email đã đăng ký. Nếu tài khoản tồn tại, chúng tôi sẽ gửi hướng dẫn đặt lại mật khẩu.</p>
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="resetEmail">Email</label>
                    <input type="email" id="resetEmail" autocomplete="email" placeholder="Nhập email của bạn" required>
                </div>
                <button type="submit" class="btn-login" id="requestResetButton">Gửi liên kết khôi phục</button>
            </form>
            <p id="forgotPasswordMessage" role="status" aria-live="polite"></p>
            <p style="margin: 14px 0 0; font-size: 13px;"><a href="dang-nhap.html">Quay lại đăng nhập</a></p>
        </section>
    </main>
    <script src="js/api.config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/forgot-password.js"></script>
</body>
</html>
